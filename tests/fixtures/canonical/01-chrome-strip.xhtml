<div xmlns="http://www.w3.org/1999/xhtml" id="content" about=""
     typeof="https://www.w3.org/ns/ldt/document-hierarchy#Container">
    <p contenteditable="true" draggable="true" class="dragging"><span data-role="chrome"
        class="drag-handle" contenteditable="false">&#x28FF;</span>First paragraph.</p>
    <h2 contenteditable="true"><span data-role="chrome" class="drag-handle"
        contenteditable="false">&#x28FF;</span>A heading</h2>
    <ul>
        <span data-role="chrome" class="drag-handle" contenteditable="false">&#x28FF;</span>
        <li contenteditable="true">Item one</li>
        <li contenteditable="true">Item two</li>
    </ul>
    <blockquote contenteditable="true"><span data-role="chrome" class="drag-handle"
        contenteditable="false">&#x28FF;</span>A quote.</blockquote>
    <figure>
        <span data-role="chrome" class="drag-handle" contenteditable="false">&#x28FF;</span>
        <img src="pic.png" alt="Pic"/>
        <figcaption contenteditable="true">Caption</figcaption>
    </figure>
</div>
